name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (no browser download needed for tests)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
